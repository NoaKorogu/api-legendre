<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>API Users</title>
<style>
body { font-family: Arial; margin: 30px; }
button { margin: 5px; }
input { margin: 5px; }
.user { margin: 5px 0; }
</style>
</head>
<body>

<h1>API Users avec Auth</h1>

<!-- LOGIN -->
<h3>Login</h3>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<pre id="loginResult"></pre>

<hr>

<!-- GET ALL USERS -->
<button onclick="getUsers()">Get users</button>

<!-- FIND USER -->
<h3>Find user by ID</h3>
<input type="number" id="userId" placeholder="User ID">
<button onclick="findUser()">Find</button>
<pre id="foundUser"></pre>

<hr>

<!-- USERS LIST -->
<h3>Users list</h3>
<div id="users"></div>

<script>
let TOKEN = null;

const API_URL = '/api/v1/users';

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  const res = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();
  if(res.ok){
    TOKEN = data.token;
    document.getElementById('loginResult').textContent = `Connecté en tant que ${data.username} (${data.role})`;
  } else {
    document.getElementById('loginResult').textContent = data.message;
  }
}

async function getUsers() {
  if(!TOKEN) return alert('Vous devez vous connecter');

  const res = await fetch(API_URL, {
    headers: { 'Authorization': `Bearer ${TOKEN}` }
  });
  const users = await res.json();

  const container = document.getElementById('users');
  container.innerHTML = '';

  users.forEach(user => {
    const div = document.createElement('div');
    div.className = 'user';
    div.innerHTML = `
      ID: ${user.id} - Name: ${user.name ?? '(no name)'}
      <button onclick="deleteUser(${user.id})">Delete</button>
      <button onclick="editUser(${user.id})">Edit</button>
    `;
    container.appendChild(div);
  });
}

async function findUser() {
  if(!TOKEN) return alert('Vous devez vous connecter');

  const id = document.getElementById('userId').value;
  if (!id) return;

  const res = await fetch(`${API_URL}/${id}`, {
    headers: { 'Authorization': `Bearer ${TOKEN}` }
  });
  const data = await res.json();

  document.getElementById('foundUser').textContent =
    res.ok ? JSON.stringify(data, null, 2) : data.message;
}

async function deleteUser(id) {
  if(!TOKEN) return alert('Vous devez vous connecter');
  if(!confirm('Supprimer cet utilisateur ?')) return;

  await fetch(`${API_URL}/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${TOKEN}` }
  });
  getUsers();
}

async function editUser(id) {
  if(!TOKEN) return alert('Vous devez vous connecter');

  const newName = prompt('Nouveau nom ?');
  if(!newName) return;

  await fetch(`${API_URL}/${id}`, {
    method: 'PUT',
    headers: { 
      'Authorization': `Bearer ${TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ name: newName })
  });
  getUsers();
}
</script>

</body>
</html>
