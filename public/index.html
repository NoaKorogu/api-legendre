<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>API Frontend</title>
  <style>
    body { font-family: Arial; margin: 30px; }
    button { margin: 5px; }
    input { margin: 5px; }
  </style>
</head>
<body>

<div id="topbar">
  <span id="status">Not logged in</span>
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" style="display:none;">Logout</button>
  <span id="roleInfo" style="margin-left:20px;"></span>
</div>

<!-- LOGIN FORM (visible when not logged in) -->
<div id="loginForm">
  <h3>Login</h3>
  <input type="text" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <pre id="loginResult"></pre>
</div>

<!-- PRODUCTS VIEW (visible when logged in) -->
<div id="productsSection" style="display:none;">
  <h2>Products</h2>
  <div id="products"></div>
  <div id="productActions" style="display:none;">
    <h4>Create Product</h4>
    <input id="pname" placeholder="Name">
    <input id="pprice" placeholder="Price" type="number" step="0.01">
    <input id="pdesc" placeholder="Description">
    <button onclick="createProduct()">Create</button>
  </div>
</div>

<!-- ADMIN SECTIONS (visible when logged in as admin) -->
<div id="adminSection" style="display:none;">
  <hr>
  <h2>Admin Panel</h2>
  <h3>Users</h3>
  <div id="users"></div>
  <h3>Sells</h3>
  <div id="sells"></div>
</div>

<script>
let TOKEN = null;
let ROLE = null;

const API_PRODUCTS = '/api/v1/products';
const API_USERS = '/api/v1/users';
const API_SELLS = '/api/v1/sells';

document.getElementById('loginBtn').addEventListener('click', () => {
  document.getElementById('loginForm').style.display = 
    (document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none');
});

document.getElementById('logoutBtn').addEventListener('click', logout);

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const res = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('loginResult').textContent = data.message || 'Login failed';
    return;
  }

  TOKEN = data.token;
  ROLE = data.role;
  
  // Update UI for logged-in state
  document.getElementById('status').textContent = `Logged in as ${data.email}`;
  document.getElementById('roleInfo').textContent = `Role: ${ROLE}`;
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'block';
  document.getElementById('loginBtn').style.display = 'none';
  document.getElementById('productsSection').style.display = 'block';

  // Show admin sections if admin
  if (ROLE === 'admin') {
    document.getElementById('adminSection').style.display = 'block';
    document.getElementById('productActions').style.display = 'block';
  }

  await loadProducts();
  if (ROLE === 'admin') {
    loadUsers();
    loadSells();
  }
}

function logout() {
  TOKEN = null;
  ROLE = null;
  document.getElementById('status').textContent = 'Not logged in';
  document.getElementById('roleInfo').textContent = '';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('loginBtn').style.display = 'block';
  document.getElementById('productsSection').style.display = 'none';
  document.getElementById('adminSection').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}

async function loadProducts() {
  const headers = TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {};
  const res = await fetch(API_PRODUCTS, { headers });
  const items = await res.json();
  const c = document.getElementById('products');
  c.innerHTML = '';
  if (!res.ok) { 
    c.textContent = items.message || 'Error loading products'; 
    return; 
  }
  items.forEach(p => {
    const div = document.createElement('div');
    div.style.margin = '8px 0';
    div.innerHTML = `<strong>${p.nom || 'Product'}</strong> — ${p.prix || ''} € <br><em>${p.description || ''}</em>`;
    if (ROLE === 'admin') {
      const edit = document.createElement('button');
      edit.textContent = 'Edit';
      edit.onclick = () => editProduct(p.id);
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.onclick = () => deleteProduct(p.id);
      div.appendChild(edit);
      div.appendChild(del);
    }
    c.appendChild(div);
  });
}

async function createProduct() {
  if (ROLE !== 'admin') return alert('Access denied');
  const nom = document.getElementById('pname').value;
  const prix = parseFloat(document.getElementById('pprice').value);
  const description = document.getElementById('pdesc').value;
  const res = await fetch(API_PRODUCTS, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
    body: JSON.stringify({ nom, prix, description })
  });
  if (res.ok) { 
    document.getElementById('pname').value = '';
    document.getElementById('pprice').value = '';
    document.getElementById('pdesc').value = '';
    loadProducts();
  } else {
    alert((await res.json()).message || 'Error');
  }
}

async function editProduct(id) {
  if (ROLE !== 'admin') return alert('Access denied');
  const nom = prompt('Name?');
  if (!nom) return;
  const prix = prompt('Price?');
  if (!prix) return;
  const description = prompt('Description?');
  await fetch(`${API_PRODUCTS}/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
    body: JSON.stringify({ nom, prix: parseFloat(prix), description })
  });
  loadProducts();
}

async function deleteProduct(id) {
  if (ROLE !== 'admin') return alert('Access denied');
  if (!confirm('Delete product?')) return;
  await fetch(`${API_PRODUCTS}/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${TOKEN}` }
  });
  loadProducts();
}

async function loadUsers() {
  const res = await fetch(API_USERS, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
  const rows = await res.json();
  const c = document.getElementById('users');
  c.innerHTML = '';
  if (!res.ok) { 
    c.textContent = rows.message || 'Error'; 
    return; 
  }
  rows.forEach(u => { 
    const d = document.createElement('div'); 
    d.style.margin = '5px 0';
    d.textContent = `${u.id} - ${u.name} (${u.email}) [${u.role}]`; 
    c.appendChild(d); 
  });
}

async function loadSells() {
  const res = await fetch(API_SELLS, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
  const rows = await res.json();
  const c = document.getElementById('sells');
  c.innerHTML = '';
  if (!res.ok) { 
    c.textContent = rows.message || 'Error'; 
    return; 
  }
  rows.forEach(s => { 
    const d = document.createElement('div'); 
    d.style.margin = '5px 0';
    d.textContent = `Sale ID ${s.id}: Product ${s.product_id}, Qty ${s.quantity}, User ${s.user_id}`; 
    c.appendChild(d); 
  });
}
</script>

</body>
</html>
